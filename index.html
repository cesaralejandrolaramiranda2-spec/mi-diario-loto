<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora de mi Loto</title>

    <style>
        /* Importamos tipografías elegantes de Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

        body {
            font-family: 'Playfair Display', serif;
            color: #e0dcd3; /* Blanco envejecido */
            margin: 0;
            padding: 0;
            
            /* IMAGEN DE FONDO */
            background-image: url('fondo.jpg'); 
            background-size: cover;             
            background-position: center;        
            background-attachment: fixed;       
            background-color: #0d0d0d; /* Fondo negro por si no carga la imagen */
        }

        /* Encabezado Principal Gótico */
        header {
            background: linear-gradient(to bottom, #000000, #121212);
            color: #ffffff;
            text-align: center;
            padding: 3rem 1rem 2rem 1rem;
            border-bottom: 2px solid #8c1c1c; /* Línea color vino sangre */
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }

        header h1 { 
            margin: 0; 
            font-family: 'Cinzel', serif; /* Letra estilo medieval/gótico */
            font-size: 2.8rem; 
            letter-spacing: 3px;
            color: #9c2a2a; /* Rojo carmín oscuro */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), 0 0 10px rgba(156, 42, 42, 0.3);
        }

        header p { 
            margin: 0.8rem 0 1.5rem 0; 
            font-size: 1.1rem; 
            font-style: italic;
            color: #8a9a86; /* Verde musgo pálido */
        }

        /* REPRODUCTOR DE MÚSICA ESTILO GÓTICO */
        .reproductor-gotico {
            background-color: #1a1a1a;
            border: 1px solid #9c7c38; /* Borde de oro viejo */
            padding: 1rem 2rem;
            border-radius: 4px;
            display: inline-block;
            margin-top: 1rem;
            box-shadow: inset 0 0 10px #000000, 0 4px 15px rgba(0,0,0,0.6);
            min-width: 300px;
        }

        .reproductor-gotico .titulo-seccion {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            color: #9c7c38;
            letter-spacing: 2px;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
        }

        #nombre-cancion { 
            color: #dfd5bf; 
            font-weight: normal; 
            font-size: 1.1rem;
            display: block;
            margin-bottom: 0.8rem;
            font-style: italic;
        }

        /* Estilo para los controles de audio nativos */
        audio {
            height: 32px;
            filter: invert(90%) sepia(20%) saturate(300%) hue-rotate(10deg); /* Tono oro/pergamino */
            outline: none;
        }

        /* Contenedor Principal de las Publicaciones */
        .contenedor {
            max-width: 650px;
            margin: 3rem auto;
            padding: 1.5rem;
            background-color: rgba(10, 10, 10, 0.75); /* Capa negra translúcida */
            backdrop-filter: blur(8px);
            border: 1px solid rgba(156, 42, 42, 0.3);
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* Tarjetas de progreso diarias */
        .tarjeta {
            background: #141414;
            padding: 2rem;
            border-radius: 2px;
            margin-bottom: 3rem;
            border: 1px solid #2a2a2a;
            border-left: 4px solid #9c2a2a; /* Detalle lateral rojo sangre */
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        }

        .fecha { 
            font-family: 'Cinzel', serif;
            font-size: 0.8rem; 
            color: #9c7c38; /* Oro viejo */
            letter-spacing: 1px; 
        }

        .tarjeta h3 { 
            font-family: 'Cinzel', serif;
            color: #ffffff; 
            margin: 0.6rem 0 1rem 0; 
            font-size: 1.6rem;
            letter-spacing: 1px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 0.5rem;
        }

        .tarjeta p {
            line-height: 1.6;
            color: #c4bfa5; /* Texto color pergamino */
        }
        
        .foto-loto {
            width: 100%;
            border: 1px solid #333333;
            filter: grayscale(15%) contrast(110%); /* Toque dramático */
            margin: 1rem 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <header>
        <h1> Loto</h1>
        <p>regalo para mi novia</p>
        
        <div class="reproductor-gotico">
            <div class="titulo-seccion">Melodía Actual</div>
            <span id="nombre-cancion">TRANSMITIENDO...</span>
            <audio id="audio-player" controls></audio>
        </div>
    </header>

    <main class="contenedor">


     <article class="tarjeta">
    <div class="fecha">17 de mayo 2026 8pm</div>
    <h3>Día 11: LA HOJITAAAAAA</h3>
    
    <img src="foto3.jpg" alt="Progreso del loto" class="foto-loto">
    
    <p>ya salio su hojita.</p>
</article>




        <article class="tarjeta">
            <div class="fecha">17 DE MAYO, 2026</div>
            <h3>Día |11: Primeras hojas</h3>
            <img src="foto2.jpeg" alt="Primeros brotes" class="foto-loto">
            <p>YA SALIERON SUS HOJITAS.</p>
        </article>
        
        <article class="tarjeta">
            <div class="fecha">4 DE MAYO, 2026</div>
            <h3>Día 1: La meta</h3>
            <img src="foto1.jpg" alt="Semilla de loto" class="foto-loto">
            <p>META</p>
        </article>

   

    </main>

    <script>
        // Aquí puedes seguir sumando canciones en los próximos días
        const canciones = [
            { titulo: "Capítulo I - LOTUS BLOSSOM", archivo: "musica1.mp3" },
            { titulo: "Capítulo II - CIGARRA", archivo: "musica2.mp3" },
            { titulo: "Capítulo III - JAZZ PARA QUE CREZCA", archivo: "musica3.mp3" },
            { titulo: "Capítulo III - LA CANCION QUE ME RECUERDA A ELLA", archivo: "musica3.mp4" } 
        ];

        let indiceActual = 0;
        const reproductor = document.getElementById('audio-player');
        const tituloTexto = document.getElementById('nombre-cancion');

        function reproducirCancion(indice) {
            reproductor.src = canciones[indice].archivo;
            tituloTexto.textContent = canciones[indice].titulo;
        }

        // Detecta el fin de la canción y pasa a la siguiente
        reproductor.addEventListener('ended', () => {
            indiceActual++;
            if (indiceActual >= canciones.length) {
                indiceActual = 0; 
            }
            reproducirCancion(indiceActual);
            reproductor.play();
        });

        // Arranca la primera pista al abrir la web
        reproducirCancion(indiceActual);
    </script>

</body>
</html>
